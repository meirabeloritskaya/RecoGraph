<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RecoGraph{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-white">

    <!-- Хедер -->
    <header class="container-fluid bg-dark py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <h1 class="text-warning m-0">RecoGraph</h1>
        <div class="d-flex gap-3">
            {% if user.is_authenticated %}
                <a href="{% url 'present:all-products' %}" class="btn btn-light btn-sm">Все товары</a>
                <a href="{% url 'users:cart' %}" class="btn btn-light btn-sm">Корзина</a>
                <a href="{% url 'present:favorites-list' %}" class="btn btn-light btn-sm">Фавориты</a>
                <a href="{% url 'users:views' %}" class="btn btn-light btn-sm">Мои просмотры</a>

                <!-- Кнопка выхода (POST-запрос) -->
                <form action="{% url 'users:logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-warning btn-sm">Выход</button>
                </form>
            {% else %}
                <a href="{% url 'users:register' %}" class="btn btn-light btn-sm">Регистрация</a>
                <a href="{% url 'users:login' %}" class="btn btn-warning btn-sm">Вход</a>
            {% endif %}
        </div>

    </div>
</header>


    <!-- Основной контент -->
    <main class="container text-center my-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Футер -->
    <footer class="container-fluid bg-dark py-3 text-center text-light">
        <p>&copy; 2025 RecoGraph. Все права защищены.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function getCSRFToken() {
        return document.querySelector('[name=csrfmiddlewaretoken]').value;
    }

    function removeFromFavorites(productId) {
        fetch(`/api/favorites/${productId}/`, {
            method: "DELETE",
            headers: {
                "X-CSRFToken": getCSRFToken(),
                "Content-Type": "application/json"
            }
        }).then(response => {
            if (response.ok) {
                location.reload();  // Перезагрузка страницы после удаления
            }
        }).catch(error => console.error("Ошибка при удалении:", error));
    }
    </script>

</body>
</html>
